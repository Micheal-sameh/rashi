services:
  app:
    build:
      args:
        user: rashi
        uid: 1001
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: rashi
    restart: unless-stopped
    working_dir: /var/www/rashi
    ports:
      - 127.0.0.1:1601:9000
    volumes:
      - ./:/var/www/rashi
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - rashi
      - central_net

networks:
  rashi:
    driver: bridge
  central_net:
    external: true
